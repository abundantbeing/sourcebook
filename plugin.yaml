manifest_version: 2
name: sourcebook
version: "0.1.0"
description: Source-grounded research notebooks for Hermes with hybrid retrieval, cross-source contradiction detection, universal model routing, and an 8-format Studio including 2-host Audio Overviews.
author: abundantbeing
license: MIT
homepage: https://github.com/abundantbeing/sourcebook
requires_hermes: ">=0.22.6"
tags:
  - notebook
  - research
  - citations
  - studio
  - audio
  - desktop
provides_tools:
  - sourcebook_search
  - sourcebook_list_notebooks
  - sourcebook_save_note
  - sourcebook_studio
  - sourcebook_analyze_data
provides_hooks:
  - pre_llm_call
python_dependencies: []
config_schema:
  chunk_chars:
    type: integer
    default: 3200
    description: Target character size per source chunk (~800 tokens).
  context_budget_chars:
    type: integer
    default: 60000
    description: Maximum packed source context size before switching from full-notebook stuffing to hybrid semantic + BM25 retrieval.
  max_images_per_deck:
    type: integer
    default: 4
    description: Maximum number of generated images allowed per Slide Deck run when image generation is enabled.
  strict_grounding:
    type: boolean
    default: false
    description: Refuse answers when grounding score falls below 0.60.
