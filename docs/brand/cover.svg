<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="folio-cover-title folio-cover-desc">
  <title id="folio-cover-title">Folio for Hermes Desktop</title>
  <desc id="folio-cover-desc">Editorial archival cover banner for Folio, a source-grounded research notebook and 7-format interactive Studio plugin for Hermes Desktop.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1c2331" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#0b0e14"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#222b3d" stroke-width="1.5"/>

  <!-- Left editorial folio spine mark -->
  <g transform="translate(88, 92)">
    <rect x="0" y="0" width="196" height="236" rx="14" fill="#111622" stroke="#2b364d" stroke-width="1.5"/>
    <rect x="16" y="16" width="164" height="204" rx="8" fill="#0d111a" stroke="#1f283b" stroke-width="1"/>
    <line x1="42" y1="16" x2="42" y2="220" stroke="#2563eb" stroke-width="2" opacity="0.8"/>

    <!-- Marginalia citation lines -->
    <rect x="56" y="42" width="96" height="8" rx="3" fill="#e5e9f0" opacity="0.9"/>
    <rect x="56" y="62" width="108" height="6" rx="2.5" fill="#6b7892"/>
    <rect x="56" y="76" width="94" height="6" rx="2.5" fill="#6b7892"/>
    <rect x="155" y="72" width="18" height="14" rx="3" fill="#172a4f" stroke="#3b82f6" stroke-width="1"/>
    <text x="164" y="82.5" text-anchor="middle" fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">1</text>

    <rect x="56" y="106" width="104" height="6" rx="2.5" fill="#6b7892"/>
    <rect x="56" y="120" width="84" height="6" rx="2.5" fill="#6b7892"/>
    <rect x="145" y="116" width="18" height="14" rx="3" fill="#172a4f" stroke="#3b82f6" stroke-width="1"/>
    <text x="154" y="126.5" text-anchor="middle" fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">2</text>

    <!-- Coverage bar inside page -->
    <rect x="56" y="166" width="108" height="6" rx="3" fill="#1b2333"/>
    <rect x="56" y="166" width="88" height="6" rx="3" fill="#3b82f6"/>
    <text x="56" y="192" fill="#8b96ac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">100% CITED</text>
  </g>

  <!-- Center wordmark & subtitle -->
  <g transform="translate(334, 128)">
    <rect x="0" y="0" width="152" height="26" rx="6" fill="#121c33" stroke="#29467d" stroke-width="1"/>
    <text x="14" y="17" fill="#7fb0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2">HERMES PLUGIN</text>

    <text x="0" y="104" fill="#f4f6fa" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="78" font-weight="750" letter-spacing="-2.5">FOLIO</text>

    <text x="2" y="146" fill="#a8b3c7" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="450">Source-grounded research notebooks for Hermes Desktop.</text>
    <text x="2" y="178" fill="#707d96" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">Cited chat, Claim Ledger, Coverage Map, Passage Inspector, and 7 interactive Studio formats.</text>
  </g>

  <!-- Right subtle format index -->
  <g transform="translate(954, 96)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
    <rect x="0" y="0" width="164" height="228" rx="12" fill="#101520" stroke="#222b3d" stroke-width="1"/>
    <text x="18" y="28" fill="#6b7892" font-size="10" letter-spacing="1.2">STUDIO FORMATS</text>
    <line x1="18" y1="39" x2="146" y2="39" stroke="#1f283b" stroke-width="1"/>
    <text x="18" y="64" fill="#cfd6e3">01  Study Guide</text>
    <text x="18" y="88" fill="#cfd6e3">02  Mind Map</text>
    <text x="18" y="112" fill="#cfd6e3">03  Flashcards</text>
    <text x="18" y="136" fill="#cfd6e3">04  Quiz</text>
    <text x="18" y="160" fill="#cfd6e3">05  Infographic</text>
    <text x="18" y="184" fill="#cfd6e3">06  Data Table</text>
    <text x="18" y="208" fill="#60a5fa" font-weight="600">07  Slide Deck</text>
  </g>
</svg>
