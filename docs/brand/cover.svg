<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="sb-cover-title sb-cover-desc">
  <title id="sb-cover-title">SourceBook for Hermes Desktop</title>
  <desc id="sb-cover-desc">Brand cover banner for SourceBook, a source-grounded research notebook and 8-format interactive Studio plugin for Hermes Desktop.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#182030" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#0b0e14"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)" opacity="0.6"/>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#222b3d" stroke-width="1.5"/>

  <!-- Left official SourceBook citation emblem tile -->
  <g transform="translate(68, 106)">
    <rect x="0" y="0" width="208" height="208" rx="44" fill="#101520" stroke="#253047" stroke-width="1.5"/>
    <!-- Hairline geometric alignment ticks -->
    <line x1="28" y1="104" x2="40" y2="104" stroke="#243046" stroke-width="1"/>
    <line x1="168" y1="104" x2="180" y2="104" stroke="#243046" stroke-width="1"/>
    <line x1="104" y1="22" x2="104" y2="32" stroke="#243046" stroke-width="1"/>
    <line x1="104" y1="176" x2="104" y2="186" stroke="#243046" stroke-width="1"/>
    <!-- SourceBook Citation Emblem -->
    <g transform="translate(32, 32) scale(1.2)">
      <polygon points="59,10 74,10 74,34 66.5,26.5 59,34" fill="#3b82f6"/>
      <polygon points="79.5,10 100,10 100,37.5 79.5,48.5" fill="#f4f6fa"/>
      <polygon points="47,10 53.5,10 53.5,30.5 44.5,30.5 100,70.5 100,95 24,22" fill="#f4f6fa"/>
      <polygon points="20,24.5 95.5,97.5 72.5,110 48,110 20,90 20,82.5 36.5,73.5 58,89 74.5,89 20,50" fill="#f4f6fa"/>
    </g>
  </g>

  <!-- Center wordmark and subtitle -->
  <g transform="translate(316, 126)">
    <rect x="0" y="0" width="128" height="26" rx="6" fill="#121c33" stroke="#29467d" stroke-width="1"/>
    <text x="64" y="17" text-anchor="middle" fill="#7fb0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2">HERMES PLUGIN</text>

    <text x="0" y="98" fill="#f4f6fa" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="68" font-weight="750" letter-spacing="-2">SourceBook</text>

    <text x="2" y="142" fill="#a8b3c7" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="450">Source-grounded research notebooks for Hermes Desktop.</text>
    <text x="2" y="172" fill="#707d96" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5">Hybrid retrieval, Claim Ledger, Contradictions, any Hermes model, and 8 Studio formats.</text>
  </g>

  <!-- Right subtle format index -->
  <g transform="translate(966, 84)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
    <rect x="0" y="0" width="164" height="252" rx="12" fill="#101520" stroke="#222b3d" stroke-width="1"/>
    <text x="18" y="28" fill="#6b7892" font-size="10" letter-spacing="1.2">STUDIO FORMATS</text>
    <line x1="18" y1="39" x2="146" y2="39" stroke="#1f283b" stroke-width="1"/>
    <text x="18" y="64" fill="#cfd6e3">01  Study Guide</text>
    <text x="18" y="88" fill="#60a5fa" font-weight="600">02  Audio Overview</text>
    <text x="18" y="112" fill="#cfd6e3">03  Mind Map</text>
    <text x="18" y="136" fill="#cfd6e3">04  Flashcards</text>
    <text x="18" y="160" fill="#cfd6e3">05  Quiz</text>
    <text x="18" y="184" fill="#cfd6e3">06  Infographic</text>
    <text x="18" y="208" fill="#cfd6e3">07  Data Table</text>
    <text x="18" y="232" fill="#cfd6e3">08  Slide Deck</text>
  </g>
</svg>
